name: PomoLight
options:
  bundleIdPrefix: com.vismo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Release
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    # Dev/test builds are ad-hoc — no keychain password prompts.
    Debug:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
    # Distribution: AUTOMATIC signing with the team — Xcode manages the App Group
    # provisioning; the developer-id export re-signs with Developer ID Application.
    Release:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: 6RH6FXY82P

targets:
  PomoLight:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: PomoLight
        PRODUCT_BUNDLE_IDENTIFIER: com.vismo.pomolight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
    # 2026-08-21: no CODE_SIGN_ENTITLEMENTS. The only entitlement this app ever
    # carried was the App Group, and that existed solely to hand the timer to the
    # widget. With the widget gone the file had nothing left in it, so it is gone
    # too — a signed build now needs no provisioning beyond the Developer ID.
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PomoLight
        LSApplicationCategoryType: "public.app-category.productivity"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: NO
        NSHumanReadableCopyright: "© 2026 PomoLight. Free & donation-supported."
        NSPrincipalClass: NSApplication
        # The pomolight:// scheme is gone with the widget: nothing else ever
        # opened it (the widget body used it as its tap target).

  PomoLightTests:
    # HOST-LESS unit tests: the bundle compiles the units under test directly
    # instead of hosting PomoLight.app. That keeps `xcodebuild test` from
    # launching the UI or playing the chime — and keeps the suite fast enough
    # to run on every change.
    # Adding a file here is only needed when a test needs a NEW production type.
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Engine/TimerEngine.swift
      - path: Sources/Views/DialFrameRate.swift
      - path: Sources/Theme/Theme.swift
      - path: Sources/Theme/Color+Contrast.swift
      # 2026-08-21: SettingsStore joined the list. It is self-contained (Foundation
      # only) and already takes its UserDefaults by injection, so testing it costs
      # nothing here — and it is the class behind both settings accidents so far.
      - path: Sources/Settings/SettingsStore.swift
      # 2026-08-21: AppModel and everything it owns. The end-of-timer wiring is the
      # one place a silent failure costs the most, and it was the last untested part
      # of the app's behaviour. The four collaborators arrive as protocols
      # (Sources/Support/FinishEffects.swift), so the suite stays host-less and mute
      # — nothing below is ever constructed by a test.
      - path: Sources/AppModel.swift
      - path: Sources/Support/FinishEffects.swift
      - path: Sources/Support/AppActivation.swift
      - path: Sources/Support/PowerAssertion.swift
      - path: Sources/Theme/ThemeStore.swift
      - path: Sources/Audio/ChimePlayer.swift
      - path: Sources/Audio/BellSynth.swift
      - path: Sources/Notifications/NotificationManager.swift
    settings:
      base:
        PRODUCT_NAME: PomoLightTests
        PRODUCT_BUNDLE_IDENTIFIER: com.vismo.pomolight.tests
        GENERATE_INFOPLIST_FILE: YES
        # Tests only ever run locally/CI — stay ad-hoc so no config needs the team.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

# A shared scheme so `xcodebuild test -scheme PomoLightTests` works from a clean
# checkout (without relying on Xcode auto-creating schemes).
schemes:
  PomoLightTests:
    build:
      targets:
        PomoLightTests: [test]
    test:
      config: Debug
      targets:
        - PomoLightTests
