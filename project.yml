name: PomoLight
options:
  bundleIdPrefix: com.vismo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Release
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  PomoLight:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: PomoLight
        PRODUCT_BUNDLE_IDENTIFIER: com.vismo.pomolight
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        # App Group entitlement is ready in PomoLight.entitlements. It needs an
        # Apple Developer account (paid) + provisioning to sign, so it's left OUT of
        # the default ad-hoc build. To activate live widget data: add
        #   CODE_SIGN_ENTITLEMENTS: PomoLight.entitlements
        # here and enable the App Groups capability with your team in Xcode.
        INFOPLIST_KEY_CFBundleDisplayName: PomoLight
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 PomoLight. Free & donation-supported."
        INFOPLIST_KEY_LSUIElement: NO
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
    dependencies:
      - target: PomoLightWidget
        embed: true

  PomoLightWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: PomoLightWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.vismo.pomolight.widget
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        # App Group entitlement ready in Widget/PomoLightWidget.entitlements —
        # add `CODE_SIGN_ENTITLEMENTS: Widget/PomoLightWidget.entitlements` once you
        # have a paid Apple Developer team, to share live timer data with the app.
        INFOPLIST_KEY_CFBundleDisplayName: PomoLight
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PomoLight
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
