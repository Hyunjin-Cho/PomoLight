name: PomoLight
options:
  bundleIdPrefix: com.vismo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Release
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    # Dev/test builds are ad-hoc — no keychain password prompts.
    Debug:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
    # Distribution: AUTOMATIC signing with the team — Xcode manages the App Group
    # provisioning; the developer-id export re-signs with Developer ID Application.
    Release:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: 6RH6FXY82P

targets:
  PomoLight:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: PomoLight
        PRODUCT_BUNDLE_IDENTIFIER: com.vismo.pomolight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # App Group (shared widget data) only in distribution builds — Debug stays
        # ad-hoc/entitlement-free so local test builds never prompt for signing.
        Release:
          CODE_SIGN_ENTITLEMENTS: PomoLight.entitlements
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PomoLight
        LSApplicationCategoryType: "public.app-category.productivity"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: NO
        NSHumanReadableCopyright: "© 2026 PomoLight. Free & donation-supported."
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: com.vismo.pomolight
            CFBundleURLSchemes:
              - pomolight
    dependencies:
      - target: PomoLightWidget
        embed: true

  PomoLightWidget:
    # ExtensionKit-style widget (Contents/Extensions + EXAppExtensionAttributes):
    # required for widget-gallery discovery on modern macOS; the legacy
    # PlugIns/NSExtension form was never picked up by chronod on Tahoe.
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: PomoLightWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.vismo.pomolight.widget
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: PomoLight
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Widget/PomoLightWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PomoLight
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.widgetkit-extension
