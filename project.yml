name: PomoLight
options:
  bundleIdPrefix: com.vismo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Release
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "2026.01"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    # Dev/test builds are ad-hoc — no keychain password prompts.
    Debug:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
    # Distribution builds are Developer ID signed (for Gumroad + notarization).
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: 6RH6FXY82P

targets:
  PomoLight:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: PomoLight
        PRODUCT_BUNDLE_IDENTIFIER: com.vismo.pomolight
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        # To turn on the widget's LIVE data, enable App Groups in Xcode (it creates
        # the Developer ID profile), then uncomment:
        # CODE_SIGN_ENTITLEMENTS: PomoLight.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: PomoLight
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 PomoLight. Free & donation-supported."
        INFOPLIST_KEY_LSUIElement: NO
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
    dependencies:
      - target: PomoLightWidget
        embed: true

  PomoLightWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: PomoLightWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.vismo.pomolight.widget
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        # Enable with the app's App Groups capability in Xcode, then uncomment:
        # CODE_SIGN_ENTITLEMENTS: Widget/PomoLightWidget.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: PomoLight
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PomoLight
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
